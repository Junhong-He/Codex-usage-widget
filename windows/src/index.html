<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Codex Usage</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="widget" id="widget">
    <header class="widget-header">
      <div>
        <h1 class="widget-title">Codex Usage</h1>
        <div class="update-status">
          <span class="status-dot" id="statusDot"></span>
          <span class="update-text" id="updateText">Updated just now</span>
        </div>
      </div>
      <div class="widget-actions">
        <button class="icon-btn" id="refreshBtn" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
            <path d="M3 3v5h5" />
            <path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16" />
            <path d="M16 21h5v-5" />
          </svg>
        </button>
      </div>
    </header>

    <main class="widget-body">
      <div class="usage-main">
        <div class="token-count" id="tokenCount">--</div>
        <div class="token-label">tokens today</div>
      </div>
      <div class="activity-dots" id="activityDots"></div>
    </main>

    <footer class="widget-footer">
      <div class="progress-row">
        <span class="progress-label">Day</span>
        <div class="progress-track">
          <div class="progress-fill" id="dayFill"></div>
        </div>
        <span class="progress-percent" id="dayPercent">--%</span>
        <span class="progress-remaining" id="dayRemaining">--</span>
      </div>
      <div class="progress-row">
        <span class="progress-label">Week</span>
        <div class="progress-track">
          <div class="progress-fill" id="weekFill"></div>
        </div>
        <span class="progress-percent" id="weekPercent">--%</span>
        <span class="progress-remaining" id="weekRemaining">--</span>
      </div>
    </footer>

    <div class="resize-handle resize-handle-tl" id="resizeHandleTL"></div>
    <div class="resize-handle resize-handle-br" id="resizeHandleBR"></div>
  </div>

  <div class="settings-panel" id="settingsPanel">
    <h2>Settings</h2>
    <label>
      API Key
      <input type="password" id="apiKeyInput" placeholder="sk-..." />
    </label>
    <label>
      Provider
      <select id="providerInput">
        <option value="mock">Mock (demo)</option>
        <option value="openai-usage">OpenAI / Codex</option>
      </select>
    </label>
    <label>
      Price per 1M tokens (USD)
      <input type="number" id="pricePer1mInput" value="5.0" step="0.1" />
    </label>
    <label>
      Monthly quota fallback (tokens)
      <input type="number" id="monthlyQuotaInput" value="150000000" />
    </label>
    <label>
      Proxy (optional, e.g. http://127.0.0.1:7890)
      <input type="text" id="proxyInput" placeholder="leave empty to use system proxy" />
    </label>
    <div class="settings-actions">
      <button id="saveSettings">Save</button>
      <button id="cancelSettings">Cancel</button>
    </div>
  </div>

  <script src="main.js"></script>
</body>
</html>
