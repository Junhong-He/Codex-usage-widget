name: Build macOS (.dmg)

# 当前未配置 Apple 签名机密，为避免推送 tag 时失败通知，默认只接受手动触发。
# 后续配好 MAC_CERT_P12 / MAC_CERT_PASSWORD / MAC_PROVISIONING_PROFILE / MAC_TEAM_ID
# 后，把下面 `on:` 改成：
# on:
#   push:
#     tags:
#       - 'v*'
#   workflow_dispatch:
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tooling
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: cd macos && xcodegen generate

      - name: Import signing certificate
        env:
          CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          echo "$CERT_P12" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "" build.keychain
          security unlock-keychain -p "" build.keychain
          security import /tmp/cert.p12 -k build.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychains -d user -s build.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "" build.keychain

      - name: Install provisioning profile
        env:
          PROFILE: ${{ secrets.MAC_PROVISIONING_PROFILE }}
        run: |
          echo "$PROFILE" | base64 --decode > /tmp/profile.provisionprofile
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.provisionprofile "$HOME/Library/MobileDevice/Provisioning Profiles/"

      - name: Build and archive
        env:
          TEAM: ${{ secrets.MAC_TEAM_ID }}
        run: |
          cd macos
          xcodebuild -scheme CodexUsageWidget -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath build/CodexUsageWidget.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            DEVELOPMENT_TEAM="$TEAM" \
            archive

      - name: Export app
        run: |
          cd macos
          xcodebuild -exportArchive \
            -archivePath build/CodexUsageWidget.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist ExportOptions.plist

      - name: Create dmg
        run: |
          cd macos
          create-dmg "Codex Usage.dmg" "build/export/CodexUsageWidget.app"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: macos/Codex Usage.dmg
